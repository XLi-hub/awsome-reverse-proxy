name: Discover candidate repositories

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-candidates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/discover.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/discover.py --check
      - name: Open triage pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No newly discovered repositories."
            exit 0
          fi
          branch="codex/discover-candidates-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/discovered.yaml
          git commit -m "chore: discover candidate repositories"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: triage discovered repositories" --body "Automated discovery only. No project is admitted to the catalog until a maintainer promotes and reviews it."
